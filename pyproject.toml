[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-edit"
version = "0.1.0"
description = "Smart document editor POC: customer source material -> standard file for internal systems (three-layer validation)"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.*",
    "langgraph-checkpoint-sqlite",
    "fastapi",
    "uvicorn",
    "python-multipart",  # multipart file uploads on POST /runs
    "pydantic>=2",
    "pymupdf>=1.24,<2",  # 2.x pulls in pymupdf-layout/onnxruntime, unused by the POC (see agent-normalize/design.md §15)
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx"]  # httpx: fastapi.testclient

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Seam fixtures name their assertion file `assert.py` (fixed by the `agent-contract` spec),
# so register it explicitly to allow `.venv/bin/python -m pytest fixtures/` for cross-owner acceptance.
python_files = ["test_*.py", "assert.py"]
# Both fixture directories contain `assert.py` (fixed by the contract), so the default import
# mode would fail on duplicate module names
addopts = "--import-mode=importlib"