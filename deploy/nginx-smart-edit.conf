# smart-edit · nginx site for the public console (port 8082)
#
#   /        -> web/dist (Vite build, SPA fallback)
#   /api/*   -> uvicorn on 127.0.0.1:8000, prefix stripped (the dev proxy does the same)
#
# Installed as /etc/nginx/sites-available/smart-edit.conf by deploy/remote-setup.sh.
server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /opt/smart-edit/web/dist;
    index index.html;

    # Uploaded PDFs / scanned material; the dev proxy has no limit but nginx defaults to 1m.
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/smart-edit.access.log;
    error_log  /var/log/nginx/smart-edit.error.log;

    # API: strip the /api prefix, exactly like vite.config.ts in development.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The knowledge assistant allows up to 120 s; keep headroom for extraction chains.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Hashed bundle names: safe to cache for a week.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a redeploy leaves clients on an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: every client route resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}